<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>ReportDesk · 报表查询</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="execution.css"></head>
<body><div class="app"><aside class="rail"><div class="logo">R</div><button id="all" title="全部报表" aria-label="全部报表">▥</button><div class="spacer"></div><button id="demo" title="体验离线演示" aria-label="体验离线演示">▷</button><button id="import-file" title="导入 XML" aria-label="导入 XML">＋</button><button id="import-folder" title="导入 HIS 根目录 / 报表目录（自动匹配 XML）" aria-label="导入 HIS 根目录 / 报表目录">▱</button><button id="recheck" title="重新检查已导入报表的适配状态" aria-label="重新检查适配">↻</button><button id="settings-open" title="连接设置" aria-label="连接设置">⚙</button><button id="logs" title="打开日志" aria-label="打开日志">≡</button></aside>
<aside class="sidebar"><h2>报表列表</h2><input id="report-search" placeholder="搜索名称、位置…" aria-label="搜索报表"><div id="report-list" class="report-list"></div><p id="library-count"></p></aside>
<main><header class="nav"><strong>报表查询</strong><span id="connection-state">尚未连接数据库</span><button id="help">使用说明</button></header><section class="workspace"><div class="work-head"><div><h1 id="report-title">选择一张报表</h1><p id="report-status">从左侧导入报表，或点击体验演示。</p></div><div class="actions"><button id="toggle-conditions" aria-expanded="true">收起条件</button><button id="metadata-open">报表说明</button><button id="sql">查看 SQL</button></div></div><div id="report-locations" class="report-locations" hidden></div><div id="issues" role="status"></div>
<section id="conditions" class="conditions"><div class="section-title"><h2>查询条件</h2><button id="collapse">收起 ↑</button></div><div class="fields"><label>数据源<select id="source"></select></label><div id="parameters" class="parameters"></div><button id="query" class="primary">开始查询 →</button></div></section>
<section class="result"><div class="result-tools"><h2 id="result-count">查询结果</h2><form id="filter-form"><input id="result-filter" placeholder="结果内查找…" aria-label="结果内查找"><button type="submit">筛选</button></form><button id="copy">复制选中行</button><button id="export">导出 Excel ↗</button></div><div id="table-wrap" class="table-wrap"><div class="empty">尚未查询</div></div><div class="paging"><span id="range"></span><button id="previous">上一段</button><button id="next">下一段</button></div></section>
<section id="execution" class="execution"><div class="execution-head"><div class="execution-heading"><svg class="execution-icon" viewBox="0 0 34 38" fill="none" aria-hidden="true"><path d="M5 2h17l7 7v27H5V2Z" fill="currentColor"/><path d="M22 2v8h7M11 27v-6m6 6V15m6 12v-9" stroke="var(--app-bg)" stroke-width="2.5" stroke-linecap="square"/></svg><span id="operation-status" role="status" aria-live="polite">准备就绪</span></div><button id="cancel" hidden>取消执行</button></div><div class="track" id="progress" role="progressbar" aria-label="执行进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div></div></div></section></section><footer><span>直接读取 XML · 报表与结果仅在本次打开期间保留</span><span>ReportDesk 0.2.0 · x64</span></footer></main></div>
<dialog id="notice"><h2 id="notice-title"></h2><pre id="notice-body"></pre><button data-close="notice">关闭</button></dialog>
<dialog id="metadata"><h2>报表说明</h2><p class="muted">可检查主表、明细版式 XML 的关联情况；匹配文件不会自动解除待适配。</p><button id="related-xml" type="button">检查关联 XML</button><h3>HIS 报表位置</h3><pre id="meta-locations"></pre><h3>适配建议</h3><pre id="meta-guidance"></pre><div class="dialog-actions"><button data-close="metadata">关闭</button></div></dialog>
<dialog id="connection"><h2>连接设置</h2><p class="muted">保存不自动连接；测试连接仅验证登录，不验证报表权限。</p><form id="connection-form" autocomplete="off"><div class="connection-grid"><label>连接名<input id="conn-name"></label><label>连接类型<select id="conn-mode"><option value="0">基本连接</option><option value="1">TNS</option></select></label></div><div id="direct-fields" class="connection-grid"><label>主机<input id="conn-host"></label><label>端口<input type="number" min="1" max="65535" value="1521" id="conn-port"></label><label>Service Name<input id="conn-service"></label></div><div id="tns-fields" hidden><label>网络服务名<select id="conn-alias"><option value="">请选择网络服务</option></select></label><details><summary>配置网络服务来源</summary><label>TNS 文件<select id="conn-tns"><option value="">请选择文件</option></select></label><div class="actions"><button id="tns-pick" type="button">浏览文件</button><button id="tns-discover" type="button">自动查找</button><button id="tns-reload" type="button">刷新服务</button></div><p class="muted">多文件时手工选择来源，不修改原 TNS 配置。</p></details></div><div class="connection-grid"><label>只读用户名<input id="conn-user" autocomplete="off"></label><label>密码<input type="password" id="conn-password" autocomplete="new-password"></label></div><label class="check"><input type="checkbox" id="conn-keep">保留当前会话密码</label><label class="check"><input type="checkbox" id="conn-remember">保存密码（当前 Windows 用户 DPAPI 加密）</label><p class="muted">程序不设查询时间或结果行数上限。连接握手仍受网络及 TNS 配置影响，取消不保证立即中断握手。</p><p id="test-status" role="status"></p><div class="dialog-actions"><button type="button" id="test-connection">测试连接</button><button type="button" data-close="connection">取消</button><button type="submit" class="primary">保存设置</button></div></form></dialog>
<dialog id="lookup"><h2 id="lookup-title">选择选项</h2><form id="lookup-filter-form"><input id="lookup-filter" placeholder="查找选项…" aria-label="查找选项"><button>查找</button></form><button id="lookup-all" hidden>选择全部编码</button><button id="lookup-clear" hidden>清空选择</button><div id="lookup-list"></div><div class="dialog-actions"><span id="lookup-range"></span><button id="lookup-prev">上一段</button><button id="lookup-next">下一段</button><button data-close="lookup">完成选择</button></div></dialog>
<script src="renderer.js"></script></body></html>
